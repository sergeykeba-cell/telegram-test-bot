name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.8", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy (informational, not yet blocking)
        # The aiogram callback-handler pattern (CallbackQuery.message typed as
        # Message | InaccessibleMessage | None) produces a large number of
        # union-attr findings that need a deliberate type-narrowing pass, not
        # a quick fix. Tracked as a follow-up; this step reports issues
        # without failing the build until that pass is done.
        run: mypy . --ignore-missing-imports --exclude legacy || true

      - name: Run tests
        run: pytest tests/ -v
