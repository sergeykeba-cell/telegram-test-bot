services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./deploy/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://appuser:apppassword@db:5432/appdb
      MINI_APP_URL: http://localhost:8081/miniapp.html
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  miniapp:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./miniapp.html:/usr/share/nginx/html/miniapp.html:ro
    ports:
      - "8081:80"

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: appdb
      DB_POSTGRESDB_USER: appuser
      DB_POSTGRESDB_PASSWORD: apppassword
      N8N_SECURE_COOKIE: "false"
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  n8n_data:
